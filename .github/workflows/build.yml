name: build

on:
  push:
    branches: [main]
    tags: ['[0-9]*']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore KROT.sln

      - name: Build
        run: dotnet build KROT.sln -c Release -p:Platform=x64 -p:TreatWarningsAsErrors=true --no-restore

      - name: Test
        run: dotnet test KROT.sln -c Release -p:Platform=x64 --no-build --logger "trx;LogFileName=tests.trx"

      - name: Check vulnerable dependencies
        run: dotnet list KROT.sln package --vulnerable --include-transitive
