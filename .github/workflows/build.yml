name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore KROT.sln

      - name: Build
        run: dotnet build KROT.sln -c Release -p:Platform=x64 --no-restore

      - name: Test
        run: dotnet test KROT.sln -c Release -p:Platform=x64 --no-build --logger "trx;LogFileName=tests.trx"

      - name: Upload CI build
        uses: actions/upload-artifact@v4
        with:
          name: KROT-v0.1.0-alpha-ci
          path: |
            src/KROT.App/bin/x64/Release/net48/
            src/KROT.Service/bin/x64/Release/net48/
          if-no-files-found: error

      - name: Create source-only release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "${{ github.ref_name }}" 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create "${{ github.ref_name }}" --title "${{ github.ref_name }}" --generate-notes
          }
