name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Номер версии без v, например 1.0'
        required: true
        type: string
      description:
        description: 'Краткое описание релиза'
        required: true
        type: string
      mode:
        description: 'Только артефакт или черновик релиза'
        required: true
        default: candidate
        type: choice
        options:
          - candidate
          - draft

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Validate release inputs
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          if ($env:RELEASE_VERSION -notmatch '^\d+\.\d+(?:\.\d+){0,2}$') {
            throw 'Version must contain only 2 to 4 numeric components.'
          }

          [xml]$props = Get-Content -LiteralPath 'Directory.Build.props'
          $projectVersion = [string]$props.Project.PropertyGroup.Version
          if ($projectVersion -ne $env:RELEASE_VERSION) {
            throw "Directory.Build.props contains '$projectVersion', expected '$env:RELEASE_VERSION'."
          }

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 8.0.x

      - name: Install pinned Inno Setup
        shell: pwsh
        run: |
          $downloadUrl = 'https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe'
          $expectedHash = '9c73c3bae7ed48d44112a0f48e66742c00090bdb5bef71d9d3c056c66e97b732'
          $installerPath = Join-Path $env:RUNNER_TEMP 'innosetup-6.7.3.exe'
          Invoke-WebRequest -Uri $downloadUrl -OutFile $installerPath
          $actualHash = (Get-FileHash -LiteralPath $installerPath -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualHash -ne $expectedHash) {
            throw "Unexpected Inno Setup SHA-256: $actualHash"
          }
          $process = Start-Process -FilePath $installerPath -ArgumentList @(
            '/VERYSILENT',
            '/SUPPRESSMSGBOXES',
            '/NORESTART',
            '/SP-'
          ) -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            throw "Inno Setup installation failed with exit code $($process.ExitCode)."
          }

      - name: Build and test installer
        shell: pwsh
        run: ./scripts/build-installer.ps1 -Version '${{ inputs.version }}'

      - name: Upload installer candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: KROT-Setup-${{ inputs.version }}-x64
          path: |
            artifacts/installer/KROT-Setup-${{ inputs.version }}-x64.exe
            artifacts/installer/KROT-Setup-${{ inputs.version }}-x64.exe.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Attest installer
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: artifacts/installer/KROT-Setup-${{ inputs.version }}-x64.exe

      - name: Create draft GitHub release
        if: inputs.mode == 'draft'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_DESCRIPTION: ${{ inputs.description }}
        run: |
          $notesPath = Join-Path $env:RUNNER_TEMP 'release-notes.md'
          @"
          # KROT zapret $env:RELEASE_VERSION

          $env:RELEASE_DESCRIPTION

          ## Возможности

          - Discord: сообщения, медиа и голосовые каналы.
          - YouTube: сайт и видео.
          - Автоматическая настройка для текущей сети.
          - Понятные индикаторы состояния.
          - Предупреждение при обнаружении VPN или прокси.
          - Работа в системном трее и автозапуск вместе с Windows.
          - Локальные журналы для диагностики и проверка новых версий.

          ## Установка

          1. Скачайте ``KROT-Setup-$env:RELEASE_VERSION-x64.exe``.
          2. Запустите установщик.
          3. Подтвердите установку службы в окне контроля учётных записей Windows.
          4. Откройте KROT zapret, выберите Discord, YouTube или оба сервиса и нажмите «Включить».

          Для установки, обновления и удаления нужны права администратора. Обычный запуск KROT zapret повышения прав не требует.

          Требования: Windows 10 или Windows 11 x64 и Microsoft .NET Framework 4.8.

          Если включён VPN или прокси, KROT zapret попросит отключить его.

          SHA-256 находится в файле ``KROT-Setup-$env:RELEASE_VERSION-x64.exe.sha256``.
          "@ | Set-Content -LiteralPath $notesPath -Encoding utf8

          gh release create "$env:RELEASE_VERSION" `
            "artifacts/installer/KROT-Setup-$env:RELEASE_VERSION-x64.exe" `
            "artifacts/installer/KROT-Setup-$env:RELEASE_VERSION-x64.exe.sha256" `
            --draft `
            --target "$env:GITHUB_SHA" `
            --title "KROT zapret $env:RELEASE_VERSION" `
            --notes-file $notesPath
